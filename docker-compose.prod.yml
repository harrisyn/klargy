# Production: run the image built by .github/workflows/docker-publish.yml.
# Copy .env.example to .env, fill it in (see docs/DEPLOYMENT.md), then:
#   docker compose -f docker-compose.prod.yml up -d
# Postgres and SMTP are external. The container applies migrations on start.
# Everything in .env is passed to the app (optional integrations such as
# Twilio, AI keys and Vercel domains included); the entries below only add
# required-variable checks and the Soketi wiring. Public settings (APP_NAME,
# APP_DOMAIN, REALTIME_PUBLIC_*) are read at runtime, so the same image works
# for any domain. Soketi provides real-time (swap for Pusher/Ably by dropping
# the service and pointing the REALTIME_* variables at them).
services:
  app:
    image: harrisyn/klargy-queue:latest
    restart: unless-stopped
    # ports:
    #   - "3000:3000"
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?}
      JWT_SECRET: ${JWT_SECRET:?}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:?}
      CRON_SECRET: ${CRON_SECRET:?}
      APP_URL: ${APP_URL:?}
      APP_DOMAIN: ${APP_DOMAIN:?}
      SMTP_HOST: ${SMTP_HOST:?}
      # The server publishes to Soketi over the internal network; browsers
      # connect to the public host/port/TLS, so expose or proxy soketi (6001)
      # and set REALTIME_PUBLIC_HOST.
      REALTIME_APP_ID: ${REALTIME_APP_ID:?}
      REALTIME_KEY: ${REALTIME_KEY:?}
      REALTIME_SECRET: ${REALTIME_SECRET:?}
      REALTIME_HOST: soketi
      REALTIME_PORT: "6001"
      REALTIME_TLS: "false"
      REALTIME_PUBLIC_HOST: ${REALTIME_PUBLIC_HOST:?}
    depends_on:
      - soketi

  soketi:
    image: quay.io/soketi/soketi:1.6-16-debian
    restart: unless-stopped
    environment:
      SOKETI_DEFAULT_APP_ID: ${REALTIME_APP_ID:?}
      SOKETI_DEFAULT_APP_KEY: ${REALTIME_KEY:?}
      SOKETI_DEFAULT_APP_SECRET: ${REALTIME_SECRET:?}
    # ports:
    #   - "6001:6001"
